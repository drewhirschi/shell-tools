# Daily Mirror: Expo / React Native app. The native ios/ project is generated on
# the Mac, so it is never synced from here.
LOCAL_ROOT=~/work/daily_mirror
SYNC=(package.json package-lock.json mobile packages)
SYNC_EXCLUDES=(node_modules .expo dist ios android)
REMOTE_DIR=work/daily-mirror-mobile
XCODE_DIR=mobile/ios                # where xcodebuild runs, relative to REMOTE_DIR
WORKSPACE=DailyMirror.xcworkspace
SCHEME=DailyMirror
BUNDLE_ID=app.dailymirror.ios
DERIVED_DATA=../../build-device     # relative to XCODE_DIR
# Runs over plain ssh in REMOTE_DIR before the signed build. Release embeds its
# JavaScript, so no Metro is needed afterwards.
PREBUILD='export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
npm ci
cd mobile
[ -d ios ] || npx expo prebuild -p ios
npx pod-install'
