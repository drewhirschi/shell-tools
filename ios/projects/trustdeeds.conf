# Trust Deeds (fin-stream): native SwiftUI app.
LOCAL_ROOT=~/work/fin-stream
SYNC=(ios/)                         # contents of ios/ land in REMOTE_DIR
REMOTE_DIR=work/fin-stream/ios      # relative to the Mac's home directory
PROJECT=TrustDeeds.xcodeproj
SCHEME=TrustDeeds
BUNDLE_ID=dev.hirschi.TrustDeeds
# The pinned Swift OpenAPI generator is a package plugin.
XCODEBUILD_ARGS=(-skipPackagePluginValidation)
# Password autofill needs this in the signed app, not just in the source tree.
REQUIRE_ENTITLEMENTS=(com.apple.developer.associated-domains)
